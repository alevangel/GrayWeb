name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Describe the problem. Add screenshots if they help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the rule ...
        2. Open the page ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 140.3 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GrayWeb version
      description: Shown in Settings → About.
    validations:
      required: true
